<!DOCTYPE html>
<html data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Rigo with Vanilla.js</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="shortcut icon" href="./4geeks.ico" />
  </head>
  <body>
    <div class="container-fluid py-5 px-3">
      <div class="row">
        <div class="col d-flex flex-row justify-content-around">
          <div
            id="cool-progress"
            class="progress w-100"
            role="progressbar"
            aria-label="Basic example"
            aria-valuenow="0"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <div class="progress-bar" style="width: 0%"></div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col d-flex flex-row justify-content-around">
          <label for="customRange3" class="form-label">Progress:&nbsp;</label>
          <input
            id="cool-slider"
            type="range"
            class="form-range"
            value="0"
            min="0"
            max="100"
            step="5"
          />
        </div>
      </div>
    </div>
    <div
      class="container-fluid d-flex flex-row justify-content-around py-5 px-3"
    >
      <button id="swapper" class="btn btn-primary">Swap contents</button>
    </div>
    <div
      id="library"
      class="container-fluid text-center d-flex flex-row flex-wrap justify-content-around pb-5 px-3"
    ></div>
    <div class="container-fluid py-5 px-3">
      <div class="row">
        <div class="col d-flex flex-row justify-content-around">
          <div
            id="cool-progress"
            class="progress w-100"
            role="progressbar"
            aria-label="Basic example"
            aria-valuenow="0"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <div class="progress-bar" style="width: 0%"></div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col d-flex flex-row justify-content-around">
          <div class="form-floating">
            <textarea
              id="book-input"
              class="form-control font-monospace"
              placeholder="Take a book, leave a book"
              id="floatingTextarea2"
              style="height: 100px"
            >
{}</textarea
            >
          </div>
          <button id="book-button" class="btn btn-primary">Add A Book</button>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
